# VIPBot — 별도 Slack 앱. TYBot·TY Archiving 과 **따로** 설치한다.
#
# 이 앱은 묻는 사람 한 명에게만 답한다. 채널 원문을 모으지 않고, 채널에 들어가지
# 않고, 파일을 읽지 않고, Canvas 를 쓰지 않는다. 그래서 그 일들에 필요한 스코프가
# 여기 **없다.** 스코프는 나중에 지우기 어렵다 — 한 번 설치되면 워크스페이스마다
# 다시 승인을 받아야 하고, 그 사이 토큰은 넓은 권한을 들고 돌아다닌다.
#
# 인바운드 포트를 열지 않는다(Socket Mode). 봇이 자기 출력을 되먹는 길과 외부에서
# 들어오는 길을 둘 다 막는다 — CLAUDE.md 아키텍처 규칙.
display_information:
  name: VIPBot
  description: 임원·VIP 전용 질의 봇. 상세 답변은 요청자 DM 으로만 보낸다
  background_color: "#2f2a4a"
features:
  app_home:
    # DM 이 유일한 답변 창구다. 메시지 탭이 꺼져 있으면 사람이 봇에게 말을 걸 수
    # 없고, 그러면 채널이 유일한 창구가 된다 — 그건 막으려던 바로 그 상태다.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    home_tab_enabled: false
  bot_user:
    display_name: vipbot
    always_online: false
oauth_config:
  scopes:
    bot:
      # 채널에서 호출을 받는다. 호출 그 자체만 보이고 채널 대화는 안 보인다.
      - app_mentions:read
      # DM 과 채널 안내를 보낸다.
      - chat:write
      # DM 으로 온 질문을 받는다(message.im 이벤트의 전제 스코프).
      - im:history
      # 요청자와의 DM 을 연다(conversations.open).
      - im:write
      # 질문에 **붙여 올린 파일 한 번**을 읽는다. 아카이브에 쓰지 않는다 —
      # 읽고, 답하고, 버린다(`question_files` · `vipbot_runtime.answer_with_files`).
      # 2026-11-06 연결 완료 뒤에 더했다. 쓰는 권한(`files:write`)은 **없다.**
      - files:read
      # Slack 사용자 ↔ 사번 매핑(identity.ensure). 권한 판정의 입구다.
      - users:read
      - users:read.email
    # 사용자 토큰 없음. 이 앱은 사람을 대신해 행동하지 않는다.
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  # 아웃바운드 연결만 쓴다. request_url 이 없다 = 새로 여는 인바운드 포트가 없다.
  socket_mode_enabled: true
  token_rotation_enabled: false
#
# 일부러 넣지 않은 것 (tests/test_vipbot_boundary.py 가 고정한다)
#
#   channels:history · groups:history · im:read 외 수집 스코프
#       → 채널 원문 수집은 TY Archiving 앱의 일이다. 두 앱이 같은 원문을 모으면
#         어느 쪽이 쓴 줄인지 알 수 없고, 되돌릴 때 한쪽만 되돌아간다
#   channels:join · channels:manage · channels:write.invites
#       → 자동 참여 금지. 봇이 스스로 들어간 채널은 아무도 승인하지 않았다
#   files:write
#       → 첨부를 **보관하지 않는다.** 질문에 붙인 파일은 이번 답변의 입력일 뿐
#         이고, 아카이브에 쌓는 것은 Archiver 의 일이다(B-83 읽기 전용)
#   canvases:write · canvases:read
#       → Canvas 는 요약 검토의 창구다. VIPBot 은 검토에 끼지 않는다
#   commands
#       → 슬래시 명령 없음. 호출 경로는 멘션과 DM 둘뿐이다
#   reactions:read · reactions:write
#       → 수집 신호를 읽지 않는다
#   message.channels · message.groups · channel_created · channel_rename
#       → 수집 이벤트. 받으면 「안 쓰더라도 받고는 있는」 상태가 되고,
#         그 상태는 로그에 남는다
