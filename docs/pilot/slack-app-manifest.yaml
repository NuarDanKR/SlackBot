# TYBot 파일럿 — Slack 앱 매니페스트
# api.slack.com/apps → Create New App → From an app manifest → 파일럿 워크스페이스 선택 → 이 YAML 붙여넣기
display_information:
  name: TYBot
  description: 태영건설 사내 아카이브 봇 (파일럿). 아카이브 원문만 근거로 답합니다.
  background_color: "#1a3a5c"
features:
  bot_user:
    display_name: tybot    # ASCII 만 허용(봇 핸들). 변경: App Home → Your App's Presence → Edit
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    # false 여야 DM 입력창이 열린다. 기본값(true)이면 "메시지를 보내는 기능이 꺼져 있습니다" 로 막힌다.
    messages_tab_read_only_enabled: false
  shortcuts:
    - name: 업무 채널 만들기
      type: global
      callback_id: create_work_channel
      description: TYBot 수집 규칙에 맞는 공개 또는 비공개 업무 채널을 만듭니다.
  slash_commands:
    - command: /채널
      description: 업무 채널을 만들거나 이름을 변경합니다.
      usage_hint: 생성 | 이름변경 | 도움말
      should_escape: false
    - command: /ty-channel
      description: /채널 명령의 영문 예비 명령입니다.
      usage_hint: 생성 | 이름변경 | 도움말
      should_escape: false
    - command: /투표
      description: 채널에서 투표를 만듭니다. 중복 선택·익명·마감 시간을 고를 수 있습니다.
      usage_hint: 질문 | 도움말
      should_escape: false
    - command: /ty-poll
      description: /투표 명령의 영문 예비 명령입니다.
      usage_hint: 질문 | 도움말
      should_escape: false
    - command: /수집상태
      description: 이 채널이 수집 대상인지, 아니면 왜 아닌지 알려줍니다.
      should_escape: false
    - command: /ty-collection
      description: /수집상태 명령의 영문 예비 명령입니다.
      should_escape: false
    - command: /피드백
      description: 답변 품질을 신고합니다. 명령만 입력하면 선택 화면이 열립니다.
      usage_hint: (비워두면 선택 화면) | 무엇이 잘못됐는지
      should_escape: false
    - command: /ty-feedback
      description: /피드백 명령의 영문 예비 명령입니다.
      usage_hint: (비워두면 선택 화면) | 무엇이 잘못됐는지
      should_escape: false
    - command: /일정
      description: 그룹웨어 팀 일정을 조회합니다. 본인에게만 표시됩니다.
      usage_hint: (비워두면 오늘·내일) | 오늘 | 이번주 | 9월 | 알림
      should_escape: false
    - command: /ty-schedule
      description: /일정 명령의 영문 예비 명령입니다.
      usage_hint: (비워두면 오늘·내일) | 오늘 | 이번주 | 9월 | 알림
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read     # @tybot 호출 수신
      - channels:history      # 공개 채널 원문 수집
      - groups:history        # 비공개 채널 원문 수집
      - im:history            # DM 수신
      - mpim:history
      - channels:read         # 채널 목록/멤버십 조회(ACL)
      - groups:read
      - users:read            # 발화자 실명 매핑
      - users:read.email      # 회사 이메일로 Slack 사용자와 사번 자동 매핑
      - chat:write            # 답변
      - im:write
      - files:read            # 첨부 다운로드 — 없으면 파일 대신 로그인 HTML(조용한 고장)
      - canvases:read         # 채널 캔버스 본문 수집(없으면 캔버스는 '미변환' 으로만 남음)
      - reactions:read        # TYBot 답변의 👍/👎 반응 이벤트 수신
      - reactions:write       # 👀 수신 표시
      - channels:join         # 채널 자가참여 — 없으면 일부 채널만 보임(조용한 고장)
      - commands              # /채널 명령과 전역 바로가기
      - channels:manage       # TYBot이 공개 업무 채널 생성·이름 변경
      - groups:write          # TYBot이 비공개 업무 채널 생성·초대·이름 변경
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels   # 공개 채널 실시간 수집
      - message.groups     # 비공개 채널 실시간 수집(봇이 초대된 곳만)
      - channel_created    # 새 공개 채널 - 이름이 규칙에 맞으면 즉시 자동 참여
      - channel_rename     # 이름을 규칙에 맞게 고치면 그때부터 수집
      - reaction_added     # TYBot 답변 👍/👎 피드백
      - reaction_removed   # 피드백 취소도 append-only 이벤트로 기록
  interactivity:
    is_enabled: true          # 전역 바로가기·모달. Socket Mode라 인바운드 Request URL은 없음
  org_deploy_enabled: false
  socket_mode_enabled: true   # 인바운드 포트 없음
  token_rotation_enabled: false
