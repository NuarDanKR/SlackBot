# TYBot 관리 콘솔 + PF 운영 콘솔 — TLS 종료와 경로 분리 (BACKLOG B-35)
#
# 설치: /etc/nginx/conf.d/tybot-console.conf
#
# ## 왜 nginx 를 앞에 두나
# 2026-09-01 에 콘솔을 사내망 전체에 열었다. **평문 HTTP 다.** 로그인 비밀번호와 세션
# 쿠키가 매 요청 사내망을 그대로 지나간다. 이 화면은 아카이브 원문 열람·환경설정
# 변경·배포 승인을 쥐고 있다.
#
# 사내망은 「아무나 못 들어오는 곳」 이지 「아무도 못 보는 곳」 이 아니다. 스위치
# 미러링·감염된 PC 한 대·ARP 스푸핑이면 같은 구간의 트래픽을 볼 수 있다.
#
# ## 두 콘솔, 두 프로세스
#   /      -> tybot-console.service     (127.0.0.1:8787)  TYBot 관리 콘솔
#   /pf/   -> pf-hermes-console.service (127.0.0.1:8788)  PF 운영 콘솔
#
# **React route 하나를 더 두는 것이 아니다.** 프로세스·계정·env·세션 쿠키·DB role 이
# 전부 다르다(오너 계획 §8.1). 같은 프로세스면 TYBot `developer` 가 PF 를 보게 되고,
# PF 가 TYBot 의 env 와 아카이브에 닿는다.
#
# 두 백엔드 모두 **루프백에만 바인딩한다.** 밖으로 나가는 문은 이 파일 하나뿐이다.
#
# ## 인증서
# 사내 CA 발급이 1순위. 없으면 자체 서명으로 시작해도 평문보다 낫다.
#
#   sudo mkdir -p /etc/pki/tybot
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 397 \
#       -keyout /etc/pki/tybot/console.key -out /etc/pki/tybot/console.crt \
#       -subj "/CN=<서버 호스트명>" -addext "subjectAltName=DNS:<서버 호스트명>"
#   sudo chmod 600 /etc/pki/tybot/console.key
#
# ## 붙인 뒤에 할 일 (순서가 있다)
# 1. 이 파일 배치 → `sudo nginx -t` → `sudo systemctl reload nginx`
# 2. 두 service 를 **루프백 바인딩으로** 재시작
# 3. 방화벽에서 8787·8788 을 막고 443·80 만 연다
# 4. **그다음에** `CONSOLE_COOKIE_SECURE=1` · `PF_CONSOLE_COOKIE_SECURE=1` 을 켜고 재시작
#
# 4번을 먼저 하면 브라우저가 쿠키를 보내지 않아 로그인이 안 되고, 화면에는
# 「비밀번호가 틀렸다」 처럼 보인다. 그 상태로 비밀번호를 세 번 바꾸게 된다.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 평문으로 온 요청은 본문을 처리하지 않고 바로 돌려보낸다. 여기서 한 번이라도
    # 처리하면 그 요청의 비밀번호는 이미 평문으로 지나간 뒤다.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/pki/tybot/console.crt;
    ssl_certificate_key /etc/pki/tybot/console.key;

    # TLS 1.2 아래는 받지 않는다. 사내 브라우저가 최신이 아니면 1.2 까지만 내린다.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TYBOT:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 자체 서명 인증서에서는 HSTS 를 켜지 않는다. 한 번 켜면 브라우저가 그 기간 동안
    # 평문 접속을 거부하는데, 인증서를 잘못 발급했을 때 되돌릴 방법이 사용자 PC 마다
    # 캐시를 지우는 것뿐이 된다. 사내 CA 인증서로 바꾼 뒤에 켠다.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 아카이브 원문·상태 파일을 다루는 화면이다. 중간 캐시에 남기지 않는다.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    client_max_body_size 8m;

    # --- PF 운영 콘솔 -------------------------------------------------------
    #
    # **`/` 보다 먼저 적는다.** nginx 는 접두사 location 중 가장 긴 것을 고르므로
    # 순서와 무관하지만, 읽는 사람에게는 분리가 먼저 보이는 편이 낫다.
    #
    # `proxy_pass` 뒤에 경로를 붙이지 않는다 — 붙이면 접두사가 잘려 나가고, PF 앱은
    # 자기 경로를 `/pf/api/...` 로 등록해 두었으므로 전부 404 가 된다.
    location /pf/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- TYBot 관리 콘솔 ----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로그 조회·배치 실행처럼 오래 걸리는 요청이 있다.
        proxy_read_timeout 120s;
    }
}
