# Hermes Slack 앱 매니페스트
#
# 사용법:
#   1. https://api.slack.com/apps → "Create New App" → "From a manifest"
#   2. 워크스페이스로 **자기 팀 슬랙 워크스페이스** 선택
#   3. YAML 탭에 이 파일 내용을 통째로 붙여넣기 → Create
#   4. "Install to Workspace" → 봇 토큰(xoxb-) 복사 → .env 의 SLACK_BOT_TOKEN
#   5. Basic Information → App-Level Tokens → "Generate Token and Scopes"
#      이름: hermes-socket / 스코프: connections:write → 토큰(xapp-) 복사 → SLACK_APP_TOKEN
#   6. Hermes 를 사용할 채널에서 /invite @Hermes (비공개 채널도 포함)
#
# 이 manifest 는 Archiver 정본을 읽는 운영 인스턴스용입니다. 원문·첨부 수집과 채널
# 자가 참여는 Archiving Bot 책임이므로 files:read·channels:join 권한을 주지 않습니다.
#
# 매니페스트를 나중에 바꾸면 앱 재설치가 필요할 수 있습니다.

display_information:
  name: Hermes
  description: Archiver 정본 기반 Q&A · 일일/주간 요약
  background_color: "#2c2d30"
  # long_description 은 174자 이상이어야 합니다. 미달이면 매니페스트 붙여넣기 단계에서
  # 이 줄을 가리키며 오류가 납니다. 문구를 줄이실 때 길이를 확인하세요.
  long_description: |
    Hermes 는 Archiving Bot 이 보존한 Slack 대화와 첨부 정본을 읽어 질문에 답하고,
    매일 오후 그날의 대화와 금요일 오후 그 주의 대화를 정리해 전달합니다.
    채널에서는 @Hermes 로 멘션하면 스레드에 답하고, DM 으로 직접 물어도 됩니다.
    답변은 아카이브에 실제로 남아 있는 내용만 사용하며, 근거가 된 채널을 함께 표시합니다.
    확인되지 않는 것은 지어내지 않고 어디를 봐야 하는지 알려줍니다.
    비공개 채널의 내용은 공개 채널 답변에서 인용하지 않습니다.

features:
  # 이 항목이 없으면 기본값이 적용되어 DM 입력창이 잠깁니다
  # ("이 앱에 메시지 보내기가 꺼져 있습니다"). 요약 전달과 1:1 질문에 DM 을 쓰므로 반드시 켭니다.
  app_home:
    home_tab_enabled: false             # 홈 탭은 쓰지 않음
    messages_tab_enabled: true          # DM 탭 표시
    messages_tab_read_only_enabled: false  # false = 사용자가 봇에게 메시지를 보낼 수 있음
  bot_user:
    display_name: Hermes
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read   # @Hermes 멘션 수신
      - channels:history    # 공개 채널 대화 읽기 (요약·최신 조회)
      - channels:read       # 봇이 속한 공개 채널 목록
      - groups:history      # 비공개 채널 대화 읽기 (봇이 초대된 곳만)
      - groups:read         # 봇이 속한 비공개 채널 목록
      - im:history          # DM 대화 읽기
      - im:read             # DM 목록
      - mpim:read           # users.conversations 가 4종(channels/groups/im/mpim)을 함께 요구함.
                            # 그룹 DM 은 코드에서 types 필터로 아예 조회하지 않는다.
      - im:write            # DM 보내기 (요약 전달)
      - chat:write          # 메시지 전송
      - users:read          # 사용자 ID → 이름 변환
      - reactions:write     # 접수 표시(👀) 리액션

settings:
  event_subscriptions:
    bot_events:
      - app_mention         # 채널에서 @Hermes
      - message.im          # DM
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true   # 공개 URL·방화벽 설정 불필요
  token_rotation_enabled: false
