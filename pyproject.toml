[project]
name = "tybot"
version = "0.1.0"
description = "TYBot — 태영건설 Slack AI 아카이브 봇"
requires-python = ">=3.11"
dependencies = [
    # 게이트웨이는 lazy import — openai 등은 필요 시 추가
    "anthropic>=0.40",
    "slack-bolt>=1.20",
    "python-dotenv>=1.0",
    # 첨부 문서 변환. 없으면 해당 형식은 '미변환' 으로 남고 경고가 뜬다.
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
