[project]
name = "hermes-hub"
version = "0.1.0"
description = "태영건설 Slack AI TFT — 멀티 워크스페이스 아카이브 봇"
requires-python = ">=3.11"
dependencies = [
    # 실제 프로바이더 SDK는 배포 환경에서 설치 (게이트웨이는 lazy import)
    # "anthropic>=0.40",
    # "openai>=1.50",
    # "slack-bolt>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
